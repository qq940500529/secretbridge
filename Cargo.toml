[workspace]
members = [
    "backend",
    "backend/local-access",
]
resolver = "3"

[workspace.package]
version = "0.3.0-beta.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
authors = ["数链创元（天津）信息技术有限责任公司"]
repository = "https://github.com/qq940500529/secretbridge"

[workspace.dependencies]
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
axum = { version = "=0.8.9", features = ["json", "ws"] }
futures-util = "=0.3.34"
hkdf = "=0.13.0"
hex = "=0.4.3"
http-body-util = "=0.1.5"
keyring = "=4.2.0"
portable-pty = "=0.9.0"
p256 = { version = "=0.14.0", features = ["ecdh"] }
png = "=0.18.1"
qrcodegen = "=1.8.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.0"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
rand = "=0.10.2"
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "serialize"], default-features = false }
schemars = "=1.2.2"
rustls-tokio-postgres = { version = "=0.5.1", default-features = false, features = ["channel-binding", "platform-verifier", "ring", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tokio-tungstenite = "=0.30.0"
tokio-util = { version = "=0.7.19", features = ["rt"] }
totp-rs = { version = "=6.0.0", default-features = false, features = ["std", "gen_secret", "otpauth", "zeroize"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
webbrowser = "=1.2.4"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
