[workspace]
members = [
    "crates/secretbridge-core",
    "crates/secretbridge-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.12"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
authors = ["数链创元（天津）信息技术有限责任公司"]
repository = "https://github.com/qq940500529/secretbridge"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json", "ws"] }
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
keyring = "=4.2.0"
portable-pty = "=0.9.0"
rusqlite = { version = "=0.40.2", features = ["bundled"], default-features = false }
rustls-tokio-postgres = { version = "=0.5.1", default-features = false, features = ["channel-binding", "platform-verifier", "ring", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tokio-tungstenite = "=0.29.0"
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
webbrowser = "=1.2.4"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
