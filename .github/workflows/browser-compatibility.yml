name: Browser compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Browser change scope
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python tools/checks/change_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
  browser-compatibility:
    name: Chromium, Firefox and WebKit acceptance
    needs: change-scope
    if: needs.change-scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, pinned
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and browsers
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build Web application
        run: pnpm build
      - name: Run browser and accessibility acceptance
        run: python tools/acceptance/test_browser_acceptance.py
      - name: Retain sanitized browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-acceptance-${{ runner.os }}-${{ runner.arch }}
          path: dist/browser-acceptance.json
          if-no-files-found: warn
          retention-days: 14
