name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-vulnerability-gate:
    name: Locked dependency vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned
        with:
          node-version: 24
      - name: Install locked dependency scanners
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          version="$(python tools/check_dependency_vulnerabilities.py --print-scanner-version cargo-audit)"
          cargo install cargo-audit --version "$version" --locked
      - name: Check Rust and production Web dependencies
        run: python tools/check_dependency_vulnerabilities.py
  database-connectors:
    name: Real PostgreSQL and MySQL connectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test disposable native database connectors
        run: bash tools/test_database_connectors.sh
  repository-checks:
    name: repository-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check public repository contents
        run: python tools/check_repository.py
      - name: Test repository checker
        run: python -m unittest discover -s tests -v
      - name: Check Web types
        run: pnpm typecheck
      - name: Test Web application
        run: pnpm test
      - name: Build Web application
        run: pnpm build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        env:
          RUST_TEST_THREADS: 2
        run: cargo test --workspace --all-targets
      - name: Test native credential store with a disposable entry
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test -p secretbridge-server native_store_round_trip_uses_a_disposable_entry -- --ignored --nocapture
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check locked dependency licenses
        run: python tools/check_dependency_licenses.py
      - name: Package matching native application and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          executable=target/debug/secretbridge-server
          if [ "${{ runner.os }}" = "Windows" ]; then executable="$executable.exe"; fi
          cargo build --locked
          python tools/package_release.py --binary "$executable" --output dist/acceptance
      - name: Test isolated native package lifecycle
        shell: bash
        run: |
          for archive in dist/acceptance/*.zip dist/acceptance/*.tar.gz; do
            if [ -f "$archive" ]; then python tools/test_packaged_delivery.py "$archive"; fi
          done
