name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      dependency: ${{ steps.scope.outputs.dependency }}
      database: ${{ steps.scope.outputs.database }}
      python: ${{ steps.scope.outputs.python }}
      web: ${{ steps.scope.outputs.web }}
      rust: ${{ steps.scope.outputs.rust }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python tools/checks/change_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
  documentation:
    name: Documentation and repository hygiene
    needs: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Check public repository contents
        run: python tools/checks/check_repository.py
      - name: Check project metadata
        run: python tools/checks/check_project_metadata.py
      - name: Test change scope policy
        run: python -m unittest tests.repository.test_change_scope -v
  dependency-vulnerability-gate:
    name: Locked dependency vulnerability gate
    needs: change-scope
    if: needs.change-scope.outputs.dependency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, pinned
        with:
          node-version-file: .node-version
      - name: Restore pinned cargo-audit
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4, pinned
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('security/dependency-vulnerability-policy.json', 'rust-toolchain.toml') }}
      - name: Install locked dependency scanners
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          version="$(python tools/checks/check_dependency_vulnerabilities.py --print-scanner-version cargo-audit)"
          installed="$(cargo audit --version 2>/dev/null || true)"
          case "$installed" in
            "cargo-audit $version"|"cargo-audit-audit $version") ;;
            *) cargo install cargo-audit --version "$version" --locked --force ;;
          esac
      - name: Check Rust and production Web dependencies
        run: python tools/checks/check_dependency_vulnerabilities.py
  database-connectors:
    name: Real databases (${{ matrix.postgresql }}, ${{ matrix.mysql }})
    needs: change-scope
    if: needs.change-scope.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql: postgres:14
            mysql: mysql:8.0
          - postgresql: postgres:17
            mysql: mysql:8.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test disposable native database connectors
        env:
          SECRETBRIDGE_TEST_PG_IMAGE: ${{ matrix.postgresql }}
          SECRETBRIDGE_TEST_MYSQL_IMAGE: ${{ matrix.mysql }}
        run: bash tools/acceptance/test_database_connectors.sh
  repository-checks:
    name: repository-checks (${{ matrix.os }})
    needs: change-scope
    if: needs.change-scope.outputs.python == 'true' || needs.change-scope.outputs.web == 'true' || needs.change-scope.outputs.rust == 'true' || needs.change-scope.outputs.dependency == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: needs.change-scope.outputs.web == 'true' || needs.change-scope.outputs.dependency == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, pinned
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        if: needs.change-scope.outputs.web == 'true' || needs.change-scope.outputs.dependency == 'true'
        run: corepack enable
      - name: Install Web dependencies
        if: needs.change-scope.outputs.web == 'true' || needs.change-scope.outputs.dependency == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install pinned Python development tools
        if: needs.change-scope.outputs.python == 'true'
        run: python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
      - name: Check Python formatting
        if: needs.change-scope.outputs.python == 'true'
        run: python -m ruff format --check tools tests
      - name: Lint Python tools and tests
        if: needs.change-scope.outputs.python == 'true'
        run: python -m ruff check tools tests
      - name: Check Web formatting
        if: needs.change-scope.outputs.web == 'true'
        run: pnpm format:web:check
      - name: Test repository checker
        if: needs.change-scope.outputs.python == 'true'
        run: python -m unittest discover -s tests -v
      - name: Check Web types
        if: needs.change-scope.outputs.web == 'true'
        run: pnpm typecheck
      - name: Test Web application
        if: needs.change-scope.outputs.web == 'true'
        run: pnpm test
      - name: Build Web application
        if: needs.change-scope.outputs.web == 'true'
        run: pnpm build
      - name: Check Rust formatting
        if: needs.change-scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        if: needs.change-scope.outputs.rust == 'true'
        env:
          RUST_TEST_THREADS: 2
        run: cargo test --workspace --all-targets
      - name: Test native credential store with a disposable entry
        if: needs.change-scope.outputs.rust == 'true' && (runner.os == 'Windows' || runner.os == 'macOS')
        run: cargo test -p secretbridge native_store_round_trip_uses_a_disposable_entry -- --ignored --nocapture
      - name: Lint Rust workspace
        if: needs.change-scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check locked dependency licenses
        if: needs.change-scope.outputs.dependency == 'true'
        run: python tools/checks/check_dependency_licenses.py
      - name: Record toolchain metadata
        if: always()
        run: python tools/release/write_ci_metadata.py --output dist/ci-metadata.json
      - name: Retain sanitized check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-checks-${{ runner.os }}-${{ runner.arch }}
          path: dist/ci-metadata.json
          if-no-files-found: warn
          retention-days: 14
  package-delivery:
    name: package-delivery (${{ matrix.os }})
    needs: change-scope
    if: needs.change-scope.outputs.package == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, pinned
        with:
          node-version-file: .node-version
      - name: Build Web assets needed by native package
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build native application
        run: cargo build --locked
      - name: Package matching native application and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          executable=target/debug/secretbridge
          if [ "${{ runner.os }}" = "Windows" ]; then executable="$executable.exe"; fi
          python tools/release/package_release.py --binary "$executable" --output dist/acceptance
      - name: Check personal-scale startup and idle resource baseline
        shell: bash
        run: |
          executable=target/debug/secretbridge
          if [ "${{ runner.os }}" = "Windows" ]; then executable="$executable.exe"; fi
          python tools/acceptance/test_personal_scale.py --binary "$executable" --rounds 2
      - name: Test isolated native package lifecycle
        shell: bash
        run: |
          archives_checked=0
          for archive in dist/acceptance/*.zip dist/acceptance/*.tar.gz; do
            if [ -f "$archive" ]; then
              python tools/release/test_packaged_delivery.py "$archive"
              archives_checked=$((archives_checked + 1))
            fi
          done
          test "$archives_checked" -eq 1
      - name: Record toolchain metadata
        if: always()
        run: python tools/release/write_ci_metadata.py --output dist/ci-metadata.json
      - name: Retain sanitized check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-delivery-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ci-metadata.json
            dist/personal-scale.json
          if-no-files-found: warn
          retention-days: 14
