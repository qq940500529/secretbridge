name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-vulnerability-gate:
    name: Locked dependency vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, pinned
        with:
          node-version-file: .node-version
      - name: Install locked dependency scanners
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          version="$(python tools/check_dependency_vulnerabilities.py --print-scanner-version cargo-audit)"
          cargo install cargo-audit --version "$version" --locked
      - name: Check Rust and production Web dependencies
        run: python tools/check_dependency_vulnerabilities.py
  database-connectors:
    name: Real databases (${{ matrix.postgresql }}, ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql: postgres:14
            mysql: mysql:8.0
          - postgresql: postgres:17
            mysql: mysql:8.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test disposable native database connectors
        env:
          SECRETBRIDGE_TEST_PG_IMAGE: ${{ matrix.postgresql }}
          SECRETBRIDGE_TEST_MYSQL_IMAGE: ${{ matrix.mysql }}
        run: bash tools/test_database_connectors.sh
  repository-checks:
    name: repository-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, pinned
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check public repository contents
        run: python tools/check_repository.py
      - name: Check project metadata
        run: python tools/check_project_metadata.py
      - name: Install pinned Python development tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
      - name: Check Python formatting
        run: python -m ruff format --check tools tests
      - name: Lint Python tools and tests
        run: python -m ruff check tools tests
      - name: Check Web formatting
        run: pnpm format:web:check
      - name: Test repository checker
        run: python -m unittest discover -s tests -v
      - name: Check Web types
        run: pnpm typecheck
      - name: Test Web application
        run: pnpm test
      - name: Build Web application
        run: pnpm build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        env:
          RUST_TEST_THREADS: 2
        run: cargo test --workspace --all-targets
      - name: Test native credential store with a disposable entry
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test -p secretbridge-server native_store_round_trip_uses_a_disposable_entry -- --ignored --nocapture
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check locked dependency licenses
        run: python tools/check_dependency_licenses.py
      - name: Package matching native application and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          executable=target/debug/secretbridge-server
          if [ "${{ runner.os }}" = "Windows" ]; then executable="$executable.exe"; fi
          cargo build --locked
          python tools/package_release.py --binary "$executable" --output dist/acceptance
      - name: Check personal-scale startup and idle resource baseline
        shell: bash
        run: |
          executable=target/debug/secretbridge-server
          if [ "${{ runner.os }}" = "Windows" ]; then executable="$executable.exe"; fi
          python tools/test_personal_scale.py --binary "$executable" --rounds 2
      - name: Test isolated native package lifecycle
        shell: bash
        run: |
          for archive in dist/acceptance/*.zip dist/acceptance/*.tar.gz; do
            if [ -f "$archive" ]; then python tools/test_packaged_delivery.py "$archive"; fi
          done
      - name: Record toolchain metadata
        if: always()
        run: python tools/write_ci_metadata.py --output dist/ci-metadata.json
      - name: Retain sanitized check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-checks-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ci-metadata.json
            dist/personal-scale.json
          if-no-files-found: warn
          retention-days: 14
